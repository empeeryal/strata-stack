name: Setup
description: pnpm, Node from .nvmrc and dependencies (the caller checks out the repository)
runs:
  using: composite
  steps:
    # Pinned to a commit (Dependabot updates the pin and the comment together).
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
