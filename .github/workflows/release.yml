name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: 0

jobs:
  release:
    name: Version packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Create release pull request or tag release
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:tag
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # The built-in token cannot trigger workflows, so a version pull request opened with it
          # gets no CI run. A fine-grained personal access token (this repository only; contents
          # and pull requests: read and write) stored as the RELEASE_TOKEN secret fixes that;
          # without the secret the workflow falls back to the built-in token.
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
