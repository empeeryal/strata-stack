# pnpm settings. pnpm 11+ reads these from here rather than from a "pnpm" field in package.json.

# Dependencies whose install scripts may run. Everything else is installed without running
# scripts; `pnpm approve-builds` adds entries when a new native dependency needs one.
allowBuilds:
  '@astrojs/compiler-rs': true
  '@libsql/client': true
  '@parcel/watcher': true
  '@resvg/resvg-js': true
  '@tailwindcss/oxide': true
  esbuild: true
  libsql: true
  satteri: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Transitive pins for packages whose advisories are fixed upstream.
overrides:
  fflate@0.7: ^0.7.5
  path-to-regexp@6: ^6.3.0
  # GHSA-wq5f-xc86-pv6w (librsvg inside sharp's prebuilt binaries) is fixed in 0.35.5.
  sharp: ^0.35.5
  # undici is resolved twice: 7.x inside miniflare (Cloudflare's local emulator) and 8.x inside
  # Astro's font loader (unifont). GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx
  # and GHSA-qrxm-fqhp-jwvm (denial of service, cache poisoning, TLS validation) are fixed in
  # 7.30.1 and 8.12.2.
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  'undici@>=8.0.0 <8.12.2': ^8.12.2
  # Astro resolves 5.9.2; GHSA-mcm9-63f2-9j32 and GHSA-x5rw-q4pp-hg5g are fixed in 5.9.3.
  devalue@<5.9.3: ^5.9.4
  # PostCSS, css-tree and magicast resolve 1.2.1; GHSA-68fv-2mgg-jv7q (an event-loop stall on a
  # crafted indexed source map) is fixed in 1.2.2.
  source-map-js: ^1.2.2
  # launch-editor inside the Changesets CLI resolves 1.10.0; GHSA-pqg4-j6r4-53mv (command
  # injection through `quote()`) is fixed in 1.11.0.
  shell-quote: ^1.11.0
  # launch-editor (Changesets CLI's editor launcher) resolves 2.14.1; GHSA-587h-7wmj-h5pm (a
  # Windows existence check bypass) is fixed in 2.14.2.
  launch-editor: ^2.14.2
  # toml inside the Netlify adapter's function bundler (zip-it-and-ship-it, which only reads
  # Cargo.toml of Rust functions) resolves 4.3.0; GHSA-4qx8-w7c3-pj3p, GHSA-9j65-hcg3-gc64 and
  # GHSA-9qmh-m7c6-f92p (quadratic parsing time) are fixed in 5.0.1.
  toml: ^5.0.1
  # @vercel/cli-config, deep inside Astro's Vercel tooling, resolves zod 4.1 and 4.6.5;
  # GHSA-mrhx-c7xc-m3w5 (memory exhaustion on oversized collections) is fixed in 4.6.6.
  'zod@<4.6.6': ^4.6.6

# Advisories with no upstream fix in build-time tooling; reviewed on dependency upgrades
# (see the CI guide, "Audit exceptions").
auditConfig:
  ignoreGhsas:
    # esbuild 0.18 pinned by drizzle-kit's config loader; the flaw is in esbuild's dev server.
    - GHSA-67mh-4wv8-2f99
    # node-forge inside listhen, the local HTTPS dev server of the Netlify adapter's tooling
    # (RSA signature verification); no patched release exists and nothing of it is deployed.
    - GHSA-86w9-cpqp-85rv
    # braces inside the Netlify adapter's function bundler (fast-glob); a crafted glob pattern
    # can exhaust the stack during a build. No patched release; nothing of it is deployed.
    - GHSA-vfj7-8cjw-p6xm
    # http-cache-semantics, Astro's cache policy for assets fetched at build time; the flaw
    # concerns a shared HTTP cache serving several users, which a build is not. No patched
    # release; revisit when Astro updates the dependency.
    - GHSA-ch52-4w7c-c8xp
